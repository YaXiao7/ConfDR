## Before fix: this error spans multiple resources. The Pod requests a PersistentVolumeClaim,
## and the PVC depends on a StorageClass. However, there is no static PersistentVolume in the cluster,
## and the StorageClass uses the provisioner "kubernetes.io/no-provisioner", which means
## the cluster does not support dynamic volume provisioning.

#     spec:
