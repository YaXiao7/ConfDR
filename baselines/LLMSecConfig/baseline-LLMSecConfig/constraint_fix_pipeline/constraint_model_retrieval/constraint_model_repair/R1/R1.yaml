# After fix: the CPU requested by the Pod does not exceed the Node CPU capacity
spec:
  containers:
  - name: container1
    image: registry.k8s.io/pause:2.0
    resources:
      requests:
        cpu: "2"
        memory: "100Mi"
      limits:
        cpu: "2"
        memory: "100Mi"
---
status:
  capacity:
    cpu: "3"
    memory: "1Gi"
    pods: "100"
  allocatable:
    cpu: "3"          # 3 CPU cores
    memory: "1Gi"
    pods: "100"       # maximum number of Pods on this node
