[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "confdr"
version = "2.0.0"
description = "Automatic formalization of Kubernetes fault taxonomies with verifiable SMT/LLM detection and repair"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0.2,<7", "z3-solver>=4.15,<5", "jsonschema>=4.23,<5"]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "ruff>=0.12,<1"]

[project.scripts]
confdr = "confdr.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/confdr/config" = ["config/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = ["._*", "**/._*"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
