apiVersion: v1
kind: PersistentVolume
metadata:
  name: data-volume
  labels: {}
spec:
  capacity:
    storage: 1Gi
  accessModes:
  - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: manual
  hostPath:
    path: /mnt/data-volume
  claimRef:
    namespace: other
    name: other-claim
