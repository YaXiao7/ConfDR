apiVersion: v1
kind: PersistentVolume
metadata:
  name: grafana-configuration
spec:
  capacity:
    storage: 1Gi
  accessModes:
  - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: manual
  hostPath:
    path: /mnt/grafana-configuration
  claimRef:
    namespace: default
    name: grafana-configuration
