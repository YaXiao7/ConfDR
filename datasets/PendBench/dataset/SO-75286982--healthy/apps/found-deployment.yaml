apiVersion: apps/v1
kind: Deployment
metadata:
  name: found
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: found
  template:
    metadata:
      labels:
        app: found
    spec:
      containers:
      - name: found
        image: registry.k8s.io/pause:3.9
        volumeMounts:
        - name: data
          mountPath: /data
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: grafana-configuration
