apiVersion: v1
kind: Pod
metadata:
  name: rook-ceph-mon-a-canary
  namespace: rook-ceph
  labels:
    app: pending-workload
spec:
  containers:
  - name: pending-workload
    image: registry.k8s.io/pause:3.9
    volumeMounts:
    - name: data
      mountPath: /data
  volumes:
  - name: data
    persistentVolumeClaim:
      claimName: rook-ceph-mon-a
