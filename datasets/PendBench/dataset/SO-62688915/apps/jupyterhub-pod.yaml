apiVersion: v1
kind: Pod
metadata:
  name: jupyterhub
  namespace: jhub
  labels:
    app: jupyterhub
spec:
  containers:
  - name: jupyterhub
    image: registry.k8s.io/pause:3.9
    volumeMounts:
    - name: data
      mountPath: /data
  volumes:
  - name: data
    persistentVolumeClaim:
      claimName: hub-db-dir
