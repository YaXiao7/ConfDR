apiVersion: v1
kind: Pod
metadata:
  name: such
  namespace: default
  labels:
    app: such
spec:
  containers:
  - name: such
    image: registry.k8s.io/pause:3.9
  affinity:
    podAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
      - labelSelector:
          matchLabels:
            app: required-peer
        topologyKey: kubernetes.io/hostname
