apiVersion: v1
kind: Pod
metadata:
  name: gpu-pod
  namespace: hami
  labels:
    app: gpu-pod
spec:
  containers:
  - name: ubuntu-container
    image: ubuntu:18.04
    resources:
      requests:
        nvidia.com/gpu: '1'
        nvidia.com/gpumem: '5120'
      limits:
        nvidia.com/gpu: '1'
        nvidia.com/gpumem: '5120'
