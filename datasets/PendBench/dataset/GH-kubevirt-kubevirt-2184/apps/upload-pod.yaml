apiVersion: v1
kind: Pod
metadata:
  name: upload
  namespace: default
  labels:
    app: upload
spec:
  containers:
  - name: upload
    image: registry.k8s.io/pause:3.9
    volumeMounts:
    - name: data
      mountPath: /data
  volumes:
  - name: data
    persistentVolumeClaim:
      claimName: pair
