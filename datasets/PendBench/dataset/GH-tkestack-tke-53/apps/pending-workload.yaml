apiVersion: apps/v1
kind: Deployment
metadata:
  name: pending-workload
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pending-workload
  template:
    metadata:
      labels:
        app: pending-workload
    spec:
      containers:
      - name: pending-workload
        image: registry.k8s.io/pause:3.9
        resources:
          requests:
            cpu: 250m
          limits: {}
