apiVersion: v1
kind: Pod
metadata:
  name: existing-volume-user-node-1
  namespace: default
  labels:
    app: existing-volume-user
spec:
  nodeName: node-1
  containers:
  - name: main
    image: registry.k8s.io/pause:3.9
    volumeMounts:
    - name: data
      mountPath: /data
  volumes:
  - name: data
    persistentVolumeClaim:
      claimName: existing-csi-claim-node-1
---
