apiVersion: v1
kind: Pod
metadata:
  name: sparkhead-0
  namespace: default
  labels:
    app: sparkhead-0
spec:
  containers:
  - name: sparkhead-0
    image: registry.k8s.io/pause:3.9
    volumeMounts:
    - name: spark-data
      mountPath: /data
  volumes:
  - name: spark-data
    persistentVolumeClaim:
      claimName: sparkhead-claim
