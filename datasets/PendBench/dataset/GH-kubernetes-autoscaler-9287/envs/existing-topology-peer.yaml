apiVersion: v1
kind: Pod
metadata:
  name: existing-topology-peer-1
  namespace: default
  labels:
    app: topo-churn
spec:
  nodeName: node-1
  containers:
  - name: pause
    image: registry.k8s.io/pause:3.9
    resources:
      requests:
        cpu: 10m
        memory: 16Mi
