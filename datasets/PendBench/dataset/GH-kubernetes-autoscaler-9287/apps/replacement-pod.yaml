apiVersion: v1
kind: Pod
metadata:
  name: replacement
  namespace: default
  labels:
    app: topo-churn
spec:
  topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: DoNotSchedule
    labelSelector:
      matchLabels:
        app: topo-churn
  containers:
  - name: pause
    image: registry.k8s.io/pause:3.9
    resources:
      requests:
        cpu: 10m
        memory: 16Mi
