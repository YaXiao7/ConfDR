apiVersion: v1
kind: Pod
metadata:
  name: cdi-upload-flex-vnf-volume-claim
  namespace: default
  labels:
    app: containerized-data-importer
    cdi.kubevirt.io: cdi-upload-server
    service: cdi-upload-flex-vnf-volume-claim
spec:
  containers:
  - name: cdi-upload-server
    image: registry.k8s.io/pause:3.9
    volumeMounts:
    - name: cdi-data-vol
      mountPath: /data
    - name: cdi-scratch-vol
      mountPath: /scratch
  volumes:
  - name: cdi-data-vol
    persistentVolumeClaim:
      claimName: flex-vnf-volume-claim
  - name: cdi-scratch-vol
    persistentVolumeClaim:
      claimName: flex-vnf-volume-claim-scratch
