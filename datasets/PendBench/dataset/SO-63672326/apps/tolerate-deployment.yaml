apiVersion: apps/v1
kind: Deployment
metadata:
  name: tolerate
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tolerate
  template:
    metadata:
      labels:
        app: tolerate
    spec:
      containers:
      - name: tolerate
        image: registry.k8s.io/pause:3.9
