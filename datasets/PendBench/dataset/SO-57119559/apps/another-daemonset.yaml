apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: another
  namespace: default
spec:
  selector:
    matchLabels:
      app: another
  template:
    metadata:
      labels:
        app: another
    spec:
      containers:
      - name: another
        image: registry.k8s.io/pause:3.9
        resources:
          requests:
            cpu: '1'
          limits: {}
