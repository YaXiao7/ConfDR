apiVersion: apps/v1
kind: Deployment
metadata:
  name: absent
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: absent
  template:
    metadata:
      labels:
        app: absent
    spec:
      containers:
      - name: absent
        image: registry.k8s.io/pause:3.9
      nodeSelector:
        beta.kubernetes.io/os: windows
