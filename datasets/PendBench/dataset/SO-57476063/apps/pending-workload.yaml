apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: pending-workload
  namespace: default
spec:
  serviceName: pending-workload
  replicas: 1
  selector:
    matchLabels:
      app: pending-workload
  template:
    metadata:
      labels:
        app: pending-workload
    spec:
      containers:
      - name: pending-workload
        image: registry.k8s.io/pause:3.9
        volumeMounts:
        - name: data
          mountPath: /data
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: datadir-kafka-0
