apiVersion: v1
kind: Pod
metadata:
  name: pending-workload
  namespace: default
  labels:
    app: pending-workload
spec:
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
        - matchExpressions:
          - key: beta.kubernetes.io/arch
            operator: In
            values:
            - unknown
  containers:
  - name: pending-workload
    image: registry.k8s.io/pause:3.9
