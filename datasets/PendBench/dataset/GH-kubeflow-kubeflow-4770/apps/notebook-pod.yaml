apiVersion: v1
kind: Pod
metadata:
  name: notebook
  namespace: default
  labels:
    app: notebook
spec:
  containers:
  - name: notebook
    image: registry.k8s.io/pause:3.9
    volumeMounts:
    - name: data
      mountPath: /data
  volumes:
  - name: data
    persistentVolumeClaim:
      claimName: data-claim
