apiVersion: v1
kind: Pod
metadata:
  name: prometheus-server
  namespace: default
  labels:
    app: prometheus-server
spec:
  containers:
  - name: prometheus-server
    image: registry.k8s.io/pause:3.9
    volumeMounts:
    - name: data
      mountPath: /data
  volumes:
  - name: data
    persistentVolumeClaim:
      claimName: data-claim
