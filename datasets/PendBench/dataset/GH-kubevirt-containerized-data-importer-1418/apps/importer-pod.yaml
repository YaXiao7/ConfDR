apiVersion: v1
kind: Pod
metadata:
  name: importer-fedora-datavolume-original
  namespace: kubevirt
  labels:
    app: importer
spec:
  containers:
  - name: importer
    image: registry.k8s.io/pause:3.9
    volumeMounts:
    - name: data
      mountPath: /data
    - name: scratch
      mountPath: /scratch
  volumes:
  - name: data
    persistentVolumeClaim:
      claimName: fedora-datavolume-original
  - name: scratch
    persistentVolumeClaim:
      claimName: fedora-datavolume-original-scratch
