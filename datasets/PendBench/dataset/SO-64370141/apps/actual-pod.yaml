apiVersion: v1
kind: Pod
metadata:
  name: actual
  namespace: default
  labels:
    app: actual
spec:
  containers:
  - name: actual
    image: registry.k8s.io/pause:3.9
    volumeMounts:
    - name: data
      mountPath: /data
  volumes:
  - name: data
    persistentVolumeClaim:
      claimName: pv-data
