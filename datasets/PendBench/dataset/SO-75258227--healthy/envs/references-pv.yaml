apiVersion: v1
kind: PersistentVolume
metadata:
  name: references
spec:
  capacity:
    storage: 2Gi
  accessModes:
  - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-storage
  claimRef:
    namespace: default
    name: references
  hostPath:
    path: /mnt/references
