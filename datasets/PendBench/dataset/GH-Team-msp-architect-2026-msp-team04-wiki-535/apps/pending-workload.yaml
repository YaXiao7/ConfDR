apiVersion: batch/v1
kind: Job
metadata:
  name: pending-workload
  namespace: default
spec:
  template:
    metadata:
      labels:
        app: pending-workload
    spec:
      containers:
      - name: pending-workload
        image: registry.k8s.io/pause:3.9
      nodeSelector:
        workload: required
      restartPolicy: Never
  backoffLimit: 0
