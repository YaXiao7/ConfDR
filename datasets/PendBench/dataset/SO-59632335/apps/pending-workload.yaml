apiVersion: v1
kind: Pod
metadata:
  name: my-cluster-zookeeper-0
  namespace: my-kafka-project
  labels:
    app: pending-workload
spec:
  containers:
  - name: pending-workload
    image: registry.k8s.io/pause:3.9
    volumeMounts:
    - name: data
      mountPath: /data
  volumes:
  - name: data
    persistentVolumeClaim:
      claimName: data-my-cluster-zookeeper-0
