apiVersion: v1
kind: Node
metadata:
  name: node-2
  annotations:
    kwok.x-k8s.io/node: fake
  labels:
    kubernetes.io/hostname: node-2
    kubernetes.io/os: linux
    kubernetes.io/arch: amd64
spec:
  taints:
  - key: dedicated-app
    value: my-dedi-app-a
    effect: NoSchedule
status:
  capacity:
    cpu: '4'
    memory: 8Gi
    pods: '110'
  allocatable:
    cpu: '4'
    memory: 8Gi
    pods: '110'
  conditions:
  - type: Ready
    status: 'True'
    reason: KubeletReady
    message: kubelet is posting ready status
  nodeInfo:
    architecture: amd64
    operatingSystem: linux
    kubeletVersion: v1.30.0
    kubeProxyVersion: v1.30.0
    containerRuntimeVersion: containerd://1.7
    kernelVersion: '6.1'
    osImage: Linux
  phase: Running
