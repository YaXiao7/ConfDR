apiVersion: v1
kind: Pod
metadata:
  name: airflow
  namespace: default
  labels:
    app: airflow
spec:
  containers:
  - name: airflow
    image: registry.k8s.io/pause:3.9
    volumeMounts:
    - name: data
      mountPath: /data
  volumes:
  - name: data
    persistentVolumeClaim:
      claimName: name
