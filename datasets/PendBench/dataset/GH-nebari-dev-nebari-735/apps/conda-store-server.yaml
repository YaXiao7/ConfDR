apiVersion: v1
kind: Pod
metadata:
  name: qhub-conda-store
  namespace: dev
  labels:
    app: pending-workload
spec:
  nodeSelector:
    confdr.example/node-role: general
  containers:
  - name: pending-workload
    image: registry.k8s.io/pause:3.9
    volumeMounts:
    - name: data
      mountPath: /data
  volumes:
  - name: data
    persistentVolumeClaim:
      claimName: provisioning
