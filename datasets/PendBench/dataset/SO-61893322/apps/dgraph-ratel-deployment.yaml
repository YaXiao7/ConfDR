apiVersion: apps/v1
kind: Deployment
metadata:
  name: dgraph-ratel
  namespace: dgraph
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dgraph-ratel
  template:
    metadata:
      labels:
        app: dgraph-ratel
    spec:
      containers:
      - name: ratel
        image: registry.k8s.io/pause:3.9
