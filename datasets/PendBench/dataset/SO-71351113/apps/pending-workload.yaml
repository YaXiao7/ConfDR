apiVersion: v1
kind: Pod
metadata:
  name: pending-workload
  namespace: default
  labels:
    app: pending-workload
spec:
  containers:
  - name: pending-workload
    image: registry.k8s.io/pause:3.9
    volumeMounts:
    - name: data
      mountPath: /data
  volumes:
  - name: data
    persistentVolumeClaim:
      claimName: bd-blackduck-authentication
