apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: before
  namespace: default
spec:
  serviceName: before
  replicas: 1
  selector:
    matchLabels:
      app: before
  template:
    metadata:
      labels:
        app: before
    spec:
      containers:
      - name: before
        image: registry.k8s.io/pause:3.9
        volumeMounts:
        - name: data
          mountPath: /data
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: lives
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            app: before
