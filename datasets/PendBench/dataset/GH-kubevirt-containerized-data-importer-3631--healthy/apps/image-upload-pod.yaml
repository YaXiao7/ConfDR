apiVersion: v1
kind: Pod
metadata:
  name: image-upload
  namespace: default
  labels:
    app: image-upload
spec:
  containers:
  - name: image-upload
    image: registry.k8s.io/pause:3.9
    volumeMounts:
    - name: data
      mountPath: /data
  volumes:
  - name: data
    persistentVolumeClaim:
      claimName: data-claim
