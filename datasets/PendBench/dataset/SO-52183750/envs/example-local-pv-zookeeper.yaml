apiVersion: v1
kind: PersistentVolume
metadata:
  name: example-local-pv-zookeeper
  labels: {}
spec:
  capacity:
    storage: 1Gi
  accessModes:
  - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: kafka-zookeeper
  hostPath:
    path: /mnt/example-local-pv-zookeeper
  nodeAffinity:
    required:
      nodeSelectorTerms:
      - matchExpressions:
        - key: kubernetes.io/hostname
          operator: In
          values:
          - my-node
