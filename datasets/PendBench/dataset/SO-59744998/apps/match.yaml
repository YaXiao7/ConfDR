apiVersion: v1
kind: Pod
metadata:
  name: match
  namespace: default
  labels:
    app: match
spec:
  containers:
  - name: match
    image: registry.k8s.io/pause:3.9
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
      - labelSelector:
          matchLabels:
            app: conflicting-peer
        topologyKey: kubernetes.io/hostname
