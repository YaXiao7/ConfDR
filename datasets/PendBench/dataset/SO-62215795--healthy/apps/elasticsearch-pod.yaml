apiVersion: v1
kind: Pod
metadata:
  name: elasticsearch
  namespace: default
  labels:
    app: elasticsearch
spec:
  containers:
  - name: elasticsearch
    image: registry.k8s.io/pause:3.9
    volumeMounts:
    - name: data
      mountPath: /data
  volumes:
  - name: data
    persistentVolumeClaim:
      claimName: elasticsearch-data-persistent-storage-elasticsearch-data-0
