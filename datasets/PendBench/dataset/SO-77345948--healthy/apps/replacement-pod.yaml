apiVersion: v1
kind: Pod
metadata:
  name: replacement
  namespace: default
  labels:
    app: replacement
spec:
  containers:
  - name: replacement
    image: registry.k8s.io/pause:3.9
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchLabels:
              app: conflicting-peer
          topologyKey: kubernetes.io/hostname
