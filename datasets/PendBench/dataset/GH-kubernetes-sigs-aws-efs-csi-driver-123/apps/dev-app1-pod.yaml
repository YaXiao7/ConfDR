apiVersion: v1
kind: Pod
metadata:
  name: dev-app1
  namespace: default
  labels:
    app: dev-app1
spec:
  containers:
  - name: app
    image: registry.k8s.io/pause:3.9
    volumeMounts:
    - name: persistent-storage
      mountPath: /data
  volumes:
  - name: persistent-storage
    persistentVolumeClaim:
      claimName: dev-csi-data-volume-claim
