apiVersion: v1
kind: Pod
metadata:
  name: xinference-worker
  namespace: default
spec:
  nodeSelector:
    kubernetes.io/arch: amd64
  tolerations:
  - key: node-role.kubernetes.io/control-plane
    operator: Exists
    effect: NoSchedule
  - key: nvidia.com/gpu
    operator: Exists
    effect: NoSchedule
  containers:
  - name: xinference-worker
    image: registry.k8s.io/pause:3.9
    ports:
    - containerPort: 30001
      protocol: TCP
    resources:
      requests:
        cpu: '2'
        memory: 8Gi
      limits:
        nvidia.com/gpu: '4'
        nvidia.com/gpucores: '10'
        nvidia.com/gpumem-percentage: '5'
