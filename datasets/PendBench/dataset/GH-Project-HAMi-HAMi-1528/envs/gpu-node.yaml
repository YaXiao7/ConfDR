apiVersion: v1
kind: Node
metadata:
  name: gpu-node
  annotations:
    kwok.x-k8s.io/node: fake
  labels:
    kubernetes.io/hostname: gpu-node
    kubernetes.io/os: linux
    kubernetes.io/arch: amd64
spec:
  taints: []
status:
  capacity:
    cpu: '16'
    memory: 64Gi
    pods: '110'
    nvidia.com/gpu: '2'
    nvidia.com/gpucores: '100'
    nvidia.com/gpumem-percentage: '100'
  allocatable:
    cpu: '16'
    memory: 64Gi
    pods: '110'
    nvidia.com/gpu: '2'
    nvidia.com/gpucores: '100'
    nvidia.com/gpumem-percentage: '100'
  conditions:
  - type: Ready
    status: 'True'
    reason: KubeletReady
    message: kubelet is posting ready status
  nodeInfo:
    architecture: amd64
    operatingSystem: linux
    kubeletVersion: v1.30.0
    kubeProxyVersion: v1.30.0
    containerRuntimeVersion: containerd://1.7
    kernelVersion: '6.1'
    osImage: Linux
  phase: Running
