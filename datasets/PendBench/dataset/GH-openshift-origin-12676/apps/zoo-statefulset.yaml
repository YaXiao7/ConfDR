apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: zoo
  namespace: default
spec:
  serviceName: zk
  replicas: 3
  selector:
    matchLabels:
      app: zk
  template:
    metadata:
      labels:
        app: zk
    spec:
      containers:
      - name: zk
        image: registry.k8s.io/pause:3.9
        ports:
        - containerPort: 2888
          name: peer
        - containerPort: 3888
          name: leader-election
        volumeMounts:
        - name: datadir
          mountPath: /tmp/zookeeper
  volumeClaimTemplates:
  - metadata:
      name: datadir
    spec:
      accessModes:
      - ReadWriteOnce
      storageClassName: anything
      resources:
        requests:
          storage: 20Gi
